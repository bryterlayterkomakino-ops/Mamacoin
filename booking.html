<script>
    let submitted = false;
    let selectedKind = "Jakob";
    let selectedAction = "Gutschrift (+)";

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const k = params.get('kind');
      const a = params.get('aktion');

      if (k) selectKind(k);
      if (a === 'minus') selectAction('Ausgabe (-)');
      if (a === 'plus') selectAction('Gutschrift (+)');
    });

    document.querySelectorAll('[data-kind]').forEach(btn => {
      btn.addEventListener('click', () => selectKind(btn.dataset.kind));
    });

    document.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => selectAction(btn.dataset.action));
    });

    function selectKind(kind) {
      selectedKind = kind;
      document.getElementById('field-kind').value = kind;
      document.querySelectorAll('[data-kind]').forEach(b => {
        b.classList.toggle('active', b.dataset.kind.toLowerCase() === kind.toLowerCase());
      });
    }

    function selectAction(action) {
      selectedAction = action;
      document.getElementById('field-action').value = action;
      document.querySelectorAll('[data-action]').forEach(b => {
        b.classList.toggle('active', b.dataset.action === action);
      });
    }

    function setAmount(val) {
      // Schreibt den Wert ins Eingabefeld
      document.getElementById('amount-input').value = val.toString().replace('.', ',');
    }

    function processSubmit() {
      const rawInput = document.getElementById('amount-input').value.trim();
      const note = document.getElementById('note-input').value.trim();
      const statusEl = document.getElementById('status-msg');
      const submitBtn = document.getElementById('submit-btn');

      // Erlaubt sowohl 1,50 als auch 1.50
      const normalizedNumber = parseFloat(rawInput.replace(',', '.'));

      if (!rawInput || isNaN(normalizedNumber) || normalizedNumber <= 0) {
        statusEl.style.color = "var(--accent-red)";
        statusEl.textContent = "Bitte einen gültigen Betrag eingeben.";
        return;
      }

      // Google Forms akzeptiert bei deutschem Sheet das Komma-Format
      document.getElementById('field-amount').value = rawInput.replace('.', ',');
      document.getElementById('field-note').value = note;

      submitBtn.disabled = true;
      submitBtn.textContent = "Wird gebucht...";
      statusEl.textContent = "";

      submitted = true;
      document.getElementById('google-form').submit();
    }

    function handleSuccess() {
      const statusEl = document.getElementById('status-msg');
      statusEl.style.color = "var(--accent-green)";
      statusEl.textContent = `✓ Buchung erfolgreich erfasst!`;

      setTimeout(() => {
        window.location.href = "index.html";
      }, 1500);
    }
  </script>
